# Random-subset sampling of recent AIGC forgery datasets.
# Unified labels:  0 = real / pristine,  1 = fully synthetic,  2 = locally manipulated (has mask)
# Masks are stored as binary PNG (255 = manipulated). Images are stored as the ORIGINAL bytes
# (no re-encoding) so low-level forensic traces are preserved; format is recorded in the manifest.

seed: 1234
out_dir: samples            # relative to the data dir ($IFL_DATA, default <repo>/data)

sources:
  # OpenSDI (CVPR'25) test split: real COCO/SA-1B + full-generation + SAM-mask inpainting,
  # 5 generators (SD1.5, SD2.1, SDXL, SD3, Flux.1-dev).
  opensdi:
    kind: hf_parquet
    repo: nebula/OpenSDI_test
    shard_prefixes: {sd15: "data/sd15-", sd2: "data/sd2-", sdxl: "data/sdxl-", sd3: "data/sd3-", flux: "data/flux-"}
    per_subset: 120
    row_groups_per_subset: 6
    id_col: key
    real_labels: [0]

  # SID-Set (SIDA, CVPR'25): real / full synthetic (FLUX) / tampered (FLUX inpainting) with masks.
  sid_set:
    kind: hf_parquet
    repo: saberzl/SID_Set
    shard_prefixes: {flux: "data/validation-"}
    per_subset: 300
    row_groups_per_subset: 10
    id_col: img_id
    real_labels: [0]

  # DiffSeg30k (2025): multi-turn local edits by 8 diffusion editors, per-pixel masks.
  diffseg30k:
    kind: hf_zip
    repo: Chaos2629/Diffseg30k
    file: validation.zip
    n: 300
    image_suffix: ".image.png"
    mask_suffix: ".mask.png"

  # TGIF2 (J. Information Security 2026, arXiv 2603.28613; CC BY-SA 4.0; github.com/IDLabMedia/tgif-dataset)
  # Random-mask release only (no object bias). The same (COCO id, variant) is drawn for the FR, SP and
  # original images -> matched pairs for the INP-X / aligned-real controls. Streams ~5.5 GB of the
  # validation archives once and keeps only the sampled members.
  tgif2:
    kind: tgif2
    token: GDGewtTFcHccaNj          # public share "TGIF2 random images"
    split: validation
    n: 150
    models:
      flux1dev: [flux1dev-fr, flux1dev-sp]
      sd2: [sd2-fr, sd2-sp]
      sdxl: [sdxl-fr]
    mask_folder: {flux1dev: masks-flux, sd2: masks-sd2, sdxl: masks-sdxl}
    orig: {model: flux1dev, token: KG48tLZZzifC5WE, folder: orig-flux}   # public share "TGIF2 FLUX images"

  # Small test sets re-hosted in youqiwong/AIGC-Loc-Testsets (downloaded whole, then sampled).
  # Newest commercial editors: GPT-Image-2 and Nano-Banana-2 (Gemini 3.1 Flash Image).
  # PROVENANCE CAVEAT: that repo has no dataset card, licence or paper (checked 2026-10-30). Use for
  # internal exploration only; for publication, obtain CocoGlide/AutoSplice from their original
  # releases and treat the GPT-Image-2/NanoBanana2 masks as unverified.
  gpt_image_2:
    kind: hf_tar
    repo: youqiwong/AIGC-Loc-Testsets
    file: GPT-Image-2/newapi_gpt_image_2_bench.tar.gz
    n: 300
  nanobanana2:
    kind: hf_tar
    repo: youqiwong/AIGC-Loc-Testsets
    file: NanoBanana2/NanoBanana2_gemini-3.1-flash-image_bench.tar.gz
    n: 300
  cocoglide:
    kind: hf_tar
    repo: youqiwong/AIGC-Loc-Testsets
    file: glide_tp.tar
    n: 300
  autosplice:
    kind: hf_tar
    repo: youqiwong/AIGC-Loc-Testsets
    file: AutoSplice_tp.tar
    n: 300

  # ---- Classical localisation benchmarks already on disk (kind: local). Root: $IFL_BENCHMARKS
  # (default M:/Benchmarks); these are licence-restricted and are not downloaded by scripts/download_data.sh.
  # Where the untouched original exists it is sampled too, with the same pair_id -> matched transplant null.
  diverse_inpaint:            # IID-Net DiverseInpainting: 11 classical / early-deep inpainting methods
    kind: local
    dir: DiverseInpaintingDataset
    layout: diverse
    n: 150
  imd2020_inpaint:            # IMD2020 synthetic inpainting set
    kind: local
    dir: IMD2020 Inpainting DS
    layout: imd2020_inpaint
    n: 150
  imd2020_real:               # IMD2020 real-life manipulations (+ originals)
    kind: local
    dir: IMD2020 Real-Life Manipulated Images
    layout: imd2020_real
    n: 150
  korus:                      # Korus & Huang realistic tampering, 4 cameras (+ pristine originals)
    kind: local
    dir: Realistic-tampering-dataset
    layout: korus
    n: 150
  nc2016:                     # NIST Nimble 2016 manipulation targets (+ base world images)
    kind: local
    dir: NC2016_Test0601/NC2016_Test0601
    layout: nc2016
    n: 150
  defacto_inpaint:            # DEFACTO inpainting subset (COCO-based)
    kind: local
    dir: Defacto
    layout: defacto_inpaint
    n: 150
  cmfd_velo:                  # copy-move benchmark (+ originals)
    kind: local
    dir: BenchmarkVelo2011CMFD
    layout: cmfd_velo
    n: 150
